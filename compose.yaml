name: analytics-service
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./ops/local/bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: ${ANALYTICS_IMAGE:-analytics-service:local}
    build:
      context: .
      args:
        RELEASE_ID: ${RELEASE_ID:-local}
    command: ["migrate"]
    environment:
      APP_ENV: local
      DATABASE_TLS: disable
      DATABASE_MIGRATION_URL: postgresql://analytics_migrator:local-migration-only@postgres:5432/analytics
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true

  app:
    image: ${ANALYTICS_IMAGE:-analytics-service:local}
    build:
      context: .
      args:
        RELEASE_ID: ${RELEASE_ID:-local}
    environment:
      APP_ENV: local
      DATABASE_TLS: disable
      DATABASE_URL: postgresql://analytics_app:local-runtime-only@postgres:5432/analytics
      PORT: "3000"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 25s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:
