name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
      - run: scripts/check.sh
      - name: Install SQLx CLI 0.9.0
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls
      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Apply migrations with the migration credential
        run: cargo run --locked -- migrate
        env:
          APP_ENV: local
          DATABASE_TLS: disable
          DATABASE_MIGRATION_URL: postgresql://analytics_migrator:local-migration-only@127.0.0.1:55432/analytics
      - name: Check committed SQLx metadata
        run: cargo sqlx prepare --check -- --locked --all-targets --features integration-tests
        env:
          DATABASE_URL: postgresql://analytics_app:local-runtime-only@127.0.0.1:55432/analytics
      - name: Run real PostgreSQL integration tests
        run: scripts/test-integration.sh
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:local-admin-only@127.0.0.1:55432/postgres
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the tested linux/amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: analytics-service:ci
          build-args: RELEASE_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise the exact tested image
        run: scripts/test-container.sh
        env:
          ANALYTICS_IMAGE: analytics-service:ci
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          docker tag analytics-service:ci "$IMAGE"
          docker push "$IMAGE"
          docker inspect --format '{{join .RepoDigests "\n"}}' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up disposable PostgreSQL
        if: always()
        run: docker compose down --volumes --remove-orphans
