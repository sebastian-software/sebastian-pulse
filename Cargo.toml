[package]
name = "analytics-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[features]
integration-tests = []

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std", "serde"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "uuid", "chrono"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }

[[test]]
name = "foundation"
required-features = ["integration-tests"]

[[test]]
name = "workspaces"
required-features = ["integration-tests"]
