[package]
name = "sebastian-pulse"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"
repository = "https://github.com/sebastian-software/sebastian-pulse"

[features]
integration-tests = []

[dependencies]
async-trait = "=0.1.92"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "=0.22.1"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
openidconnect = { version = "=4.0.1", default-features = false }
rmcp = { version = "=3.6.0", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
schemars = { version = "=1.2.1", features = ["uuid1"] }
subtle = "=2.6.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std", "serde"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "uuid", "chrono"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
workos = { version = "=3.4.0", default-features = false }

[[test]]
name = "foundation"
required-features = ["integration-tests"]

[[test]]
name = "workspaces"
required-features = ["integration-tests"]

[[test]]
name = "auth_store"
required-features = ["integration-tests"]

[[test]]
name = "authentication"
required-features = ["integration-tests"]

[[test]]
name = "workos_authentication"
required-features = ["integration-tests"]
