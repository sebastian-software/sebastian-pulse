services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rauthy -d rauthy"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  rauthy:
    image: ghcr.io/sebadob/rauthy:0.37.2@sha256:d733b7580f53c1601c286b5504853b2774e70245f5f9427d9bcda32496b753ee
    restart: unless-stopped
    command: ["serve", "-c", "/app/config.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - .env
    environment:
      HIQLITE: "false"
      HQL_CACHE_STORAGE_DISK: "true"
      LISTEN_SCHEME: "http"
      LISTEN_PORT_HTTP: "8080"
      PUB_URL: "localhost:8180"
      OPEN_USER_REG: "false"
      SMTP_URL: "mailpit"
      SMTP_PORT: "1025"
      SMTP_TLS_MODE: "danger-insecure"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./secrets.toml:/app/secrets.toml:ro
      - ./bootstrap:/app/bootstrap:ro
      - rauthy-data:/app/data

volumes:
  postgres-data:
  rauthy-data:
